<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;height:64px;overflow:hidden;background:#f5f5f6;color:#25272b;font:13px "Segoe UI",sans-serif}form{height:64px;display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid #e7e8eb}button,input{font:inherit}button{height:36px;min-width:36px;display:grid;place-items:center;padding:0 9px;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer}button:hover{background:#e8e8eb}button:focus-visible,input:focus-visible{outline:2px solid #8a1921;outline-offset:2px}svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}label{flex:1;display:flex;min-width:0;align-items:center;gap:9px;border:1px solid #d8d9dd;border-radius:7px;background:white;padding:0 10px}label:focus-within{outline:2px solid #8a1921;outline-offset:1px}label svg{width:15px;color:#5d6066;flex:none}input{min-width:0;flex:1;border:0;outline:0!important;padding:9px 0;background:transparent;color:inherit;caret-color:#c5212b}input::placeholder{color:#5d6066}button.use{background:#c5212b;color:#fff;font-weight:600;white-space:nowrap;padding:0 15px;margin-left:4px}button.use:hover{background:#aa1821}.session{width:7px;height:7px;border-radius:50%;background:#919399;flex:none}.session.active{background:#247044}.status{font-size:11px;color:#5d6066;max-width:190px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}.status.error{color:#aa1821}@media(max-width:1000px){.status{display:none}form{padding-left:10px;padding-right:10px;gap:5px}}@media(prefers-reduced-motion:no-preference){button{transition:background 150ms ease-out}}
</style></head><body><form id="navigation">
<button type="button" data-action="back" aria-label="Atrás" title="Atrás"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"/></svg></button>
<button type="button" data-action="forward" aria-label="Adelante" title="Adelante"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7M17 12H4"/></svg></button>
<button type="button" data-action="reload" aria-label="Recargar" title="Recargar"><svg viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 0 6M20 3v6h-6"/></svg></button>
<label><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg><input id="address" aria-label="Dirección de Netflix" placeholder="Pega un enlace de Netflix" spellcheck="false" autocomplete="off"><button type="submit" aria-label="Ir a la dirección" title="Ir"><svg viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></button></label>
<span class="session" id="session" title="Sesión del navegador"></span><span class="status" id="status" role="status"></span><button type="button" class="use" data-action="use">Usar enlace</button></form><script>
let editedAddress=false;document.getElementById('address').addEventListener('input',()=>editedAddress=true);
const send=(Action,URL='')=>{try{if(Action==='use')document.getElementById('status').textContent='Enviando enlace…';window.chrome.webview.postMessage(JSON.stringify({Action,URL,Token:"__LOCAL_TOOLBAR_TOKEN__"}))}catch{document.getElementById('status').textContent='No se pudo enviar. Vuelve a abrir el navegador.';document.getElementById('status').classList.add('error')}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;send(action,action==='use'&&editedAddress?document.getElementById('address').value:'');if(action==='use')editedAddress=false});
document.getElementById('navigation').onsubmit=e=>{e.preventDefault();send('navigate',document.getElementById('address').value);editedAddress=false};
window.updateBrowser=s=>{const input=document.getElementById('address');if(document.activeElement!==input&&!editedAddress)input.value=s.address||'';document.getElementById('session').classList.toggle('active',!!s.session);document.getElementById('session').title=s.session?'Sesión guardada cargada':'Sesión propia del navegador';const status=document.getElementById('status');status.textContent=s.note||'';status.classList.toggle('error',!!s.error);status.title=s.note||''};
</script></body></html>
